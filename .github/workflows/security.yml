name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:00 UTC — catches newly-disclosed vulns even when no PR lands.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install govulncheck
        # Renovate-tracked via customManagers in renovate.json
        # (datasource: go, depName: golang.org/x/vuln).
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # gitleaks-action@v2 requires a paid license for orgs; install
      # the binary via the shared composite action centralised in
      # omurlabs/.github. Version pin lives there; one Renovate bump
      # rolls all consumer repos.
      - uses: omurlabs/.github/.github/actions/install-gitleaks@28ced76bd5d24f95e4c7b75b981e1f52c69c2a2a  # main

      - name: Gitleaks scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Full-history sweep on nightly and manual runs.
            LOG_OPTS=""
          else
            LOG_OPTS="HEAD~1..HEAD"
          fi
          gitleaks detect --source . \
                          --config .gitleaks.toml \
                          ${LOG_OPTS:+--log-opts="$LOG_OPTS"} \
                          --redact \
                          --verbose
