name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:00 UTC — catches newly-disclosed vulns even when no PR lands.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Install govulncheck
        # Renovate-tracked via customManagers in renovate.json
        # (datasource: go, depName: golang.org/x/vuln).
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # gitleaks-action@v2 requires a paid license for orgs; run the binary
        # directly. Renovate-tracked via customManagers in renovate.json.
        #
        # We deliberately do NOT use the shared composite action in
        # omurlabs/.github here: that repo is private, and GitHub Actions
        # cannot resolve actions from a private repo when the consumer
        # repo is public (this repo is public).
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          TMP=$(mktemp -d)
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$TMP" gitleaks
          sudo install -m 0755 "$TMP/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$TMP"
          gitleaks version

      - name: Gitleaks scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Full-history sweep on nightly and manual runs.
            LOG_OPTS=""
          else
            LOG_OPTS="HEAD~1..HEAD"
          fi
          gitleaks detect --source . \
                          --config .gitleaks.toml \
                          ${LOG_OPTS:+--log-opts="$LOG_OPTS"} \
                          --redact \
                          --verbose
