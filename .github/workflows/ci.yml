name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# Integration tests against real Postgres/Valkey are run locally and in
# omur (where the services actually deploy). CI here is unit-only —
# DB-dependent tests `t.Skip` when TEST_POSTGRES_DSN / TEST_REDIS_ADDR
# are unset, which they are here.

jobs:
  unit:
    name: unit (no services)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: go mod download
        run: go mod download

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # No TEST_POSTGRES_DSN / TEST_REDIS_ADDR — postgres/valkey-dependent
      # tests t.Skip when the env vars are unset. This job runs only the
      # unit-tier tests deterministically.
      - name: go test (unit only)
        run: go test -race -count=1 ./...
